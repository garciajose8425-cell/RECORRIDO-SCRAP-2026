<!DOCTYPE html>
<html>

<head>

<title>Recorridos en Planta</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
font-size:28px;
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
margin-top:40px;
}

th,td{
border:1px solid #444;
padding:12px;
}

th{
background:#0078d4;
}

</style>

</head>

<body>

<h1>RECORRIDOS EN VIVO</h1>

<table>

<thead>

<tr>
<th>SAP</th>
<th>NOMBRE</th>
<th>AREA</th>
<th>SALIDA</th>
<th>ESTADO</th>
</tr>

</thead>

<tbody id="tablaTV"></tbody>

</table>

<script>

const API="https://script.google.com/macros/s/AKfycbwObIdetFPSxE59OMsErdwIzVT_xd8PQhpzzZFJqT9PqgCOEIYjJfENsk2ekqVmPpZv/exec";

async function cargar(){

const res=await fetch(API);
const data=await res.json();

const tbody=document.getElementById("tablaTV");

tbody.innerHTML="";

data.activos.forEach(r=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${r.SAP_ID}</td>
<td>${r.NOMBRE}</td>
<td>${r.AREA}</td>
<td>${r.ENTRADA}</td>
<td style="color:yellow">EN RECORRIDO</td>
`;

tbody.appendChild(tr);

});

}

setInterval(cargar,3000);

cargar();

</script>

</body>

</html>
